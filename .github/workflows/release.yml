name: Release binaries

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # build Linux binaries on the oldest runners available so they run on older glibc versions
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, name: linux-x86_64 }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, name: linux-aarch64 }
          - { os: macos-latest, target: aarch64-apple-darwin, name: macos-aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Record build info
        run: |
          echo "PLANETILER_GITHASH=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "PLANETILER_BUILD_TIMESTAMP=$(date +%s)000" >> "$GITHUB_ENV"
      - run: cargo build --release --locked -p planetiler --target ${{ matrix.target }}
      - name: Package
        run: |
          cp target/${{ matrix.target }}/release/planetiler planetiler
          tar -czf planetiler-${{ matrix.name }}.tar.gz planetiler LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: planetiler-${{ matrix.name }}
          path: planetiler-${{ matrix.name }}.tar.gz

  release:
    name: publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: planetiler-*
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --repo "$GITHUB_REPOSITORY" --generate-notes
