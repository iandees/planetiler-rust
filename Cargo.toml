[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/onthegomap/planetiler"

[workspace.dependencies]
planetiler-core = { path = "crates/planetiler-core" }
planetiler-custommap = { path = "crates/planetiler-custommap" }
planetiler-openmaptiles = { path = "crates/planetiler-openmaptiles" }
planetiler-examples = { path = "crates/planetiler-examples" }

# geometry
geo = "0.33"
geo-types = "0.7"
geo-traits = "0.3"
rstar = "0.13"
i_overlay = "9"
wkb = "0.9"
proj4rs = "0.1"

# encoding / formats
prost = "0.14"
prost-build = "0.14"
protox = "0.10"
flate2 = "1"
crc32fast = "1"
libdeflater = "1"
zstd = "0.14"
lz4_flex = "0.14"
brotli = "9"
rusqlite = { version = "0.40", features = ["bundled"] }
rmp = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
shapefile = "0.9"
parquet = "60"
arrow = "60"
csv = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

# infra
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossbeam-channel = "0.5"
parking_lot = "0.12"
rayon = "1"
memmap2 = "0.9"
num_cpus = "1"
libc = "0.2"
mimalloc = { version = "0.1", default-features = false }
sysinfo = "0.39"
indexmap = { version = "2", features = ["serde"] }
hashbrown = "0.17"
ahash = "0.8"
foldhash = "0.2"
regex = "1"
once_cell = "1"
chrono = "0.4"
ureq = "3"
clap = { version = "4", features = ["derive"] }
cel = "0.15"
tempfile = "3"
roaring = "0.11"
icu_experimental = "0.6"
icu_properties = "2.3"
any_ascii = "0.3"

# test
proptest = "1"
criterion = "0.8"
approx = "0.5"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 16

[profile.dev.package."*"]
opt-level = 2
